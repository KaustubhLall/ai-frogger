name: CI

on:
  push:
  pull_request:

jobs:
  headless:
    name: Headless build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure headless build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAI_FROGGER_BUILD_VIZ=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Smoke test CLIs
        run: |
          ./build/src/frogger_headless --agent heuristic --episodes 5 --seed 1337
          ./build/src/frogger_headless --compare --episodes 3 --seed 7
          ./build/src/frogger_benchmark --episodes 5 --seed 1
          ./build/src/frogger_train --population 6 --generations 3 --episodes 2 --seed 42 --save /tmp/weights.bin
          ./build/src/frogger_train --load /tmp/weights.bin --eval 3 --seed 42
